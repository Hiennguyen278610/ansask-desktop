name: Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-22.04
    steps:
      - name: Ensure draft release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release for tag $TAG already exists; reusing."
          else
            echo "Creating draft release for tag $TAG..."
            gh release create "$TAG" --draft --title "ansask-desktop $TAG" --notes "Release $TAG" --repo "$GITHUB_REPOSITORY"
          fi

  publish-tauri:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: '--bundles nsis'
          - platform: 'ubuntu-22.04'
            args: '--bundles deb'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'ansask-desktop ${{ github.ref_name }}'
          releaseBody: 'Xem chi tiết tại CHANGELOG.md'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish-android:
    needs: prepare-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android

      - name: Setup Android SDK & NDK
        run: |
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.3.13750724" "platforms;android-36" "build-tools;36.0.0"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Android Release APK
        run: pnpm tauri android build --apk --target aarch64 --ci

      - name: Sign and Upload APK to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          UNSIGNED_APK="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          if [ -z "$UNSIGNED_APK" ]; then
            echo "No APK found!"
            exit 1
          fi
          ALIGNED_APK="aligned.apk"
          SIGNED_APK="ansask_${TAG}_android_aarch64.apk"

          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias ansask \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass ansask123 -keypass ansask123 \
            -dname "CN=Ansask, OU=Mobile, O=Ansask, L=VN, S=VN, C=VN"

          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -p -f 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks release.keystore \
            --ks-pass pass:ansask123 \
            --key-pass pass:ansask123 \
            --ks-key-alias ansask \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          gh release upload "$TAG" "$SIGNED_APK" --clobber --repo "$GITHUB_REPOSITORY"

  finalize-release:
    needs: [publish-tauri, publish-android]
    runs-on: ubuntu-22.04
    steps:
      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
