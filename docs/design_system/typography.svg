<text class="t-h3 w-300" x="180" y="80">Trăm năm trong cõi người ta, chữ tài chữ mệnh khéo là ghét nhau.</text>
<!-- Regular 400 -->

<text class="t-caption c-muted" x="24" y="130">Regular 400</text>
<text class="t-h3 w-400" x="180" y="130">Trăm năm trong cõi người ta, chữ tài chữ mệnh khéo là ghét nhau.</text>
<!-- Medium 500 -->

<text class="t-caption c-muted" x="24" y="180">Medium 500</text>
<text class="t-h3 w-500" x="180" y="180">Trăm năm trong cõi người ta, chữ tài chữ mệnh khéo là ghét nhau.</text>
<!-- SemiBold 600 -->

<text class="t-caption c-muted" x="24" y="230">SemiBold 600</text>
<text class="t-h3 w-600" x="180" y="230">Trăm năm trong cõi người ta, chữ tài chữ mệnh khéo là ghét nhau.</text>
<!-- Bold 700 -->

<text class="t-caption c-muted" x="24" y="280">Bold 700</text>
<text class="t-h3 w-700" x="180" y="280">Trăm năm trong cõi người ta, chữ tài chữ mệnh khéo là ghét nhau.</text>
</g>
<!-- ================= TYPE SCALE ================= --> <g id="scale" transform="translate(64, 1380)"> <rect x="0" y="0" width="1312" height="580" rx="5" class="bg-surface"/>

<text class="t-overline c-muted" x="24" y="32">Type Scale (Ratio 1.25)</text>
<!-- Table Headers -->

<text class="t-caption c-muted w-600" x="24" y="70">TOKEN</text>
<text class="t-caption c-muted w-600" x="300" y="70">SAMPLE</text>
<text class="t-caption c-muted w-600" x="850" y="70">SIZE / LH</text>
<text class="t-caption c-muted w-600" x="1000" y="70">WEIGHT</text>
<text class="t-caption c-muted w-600" x="1120" y="70">TRACKING</text>
<line x1="24" y1="85" x2="1288" y2="85" stroke="var(--border)" stroke-width="1"/> <!-- Display -->

<text class="t-code c-muted" x="24" y="125" font-size="13px">t-display</text>
<text class="t-display" x="300" y="135">Display</text>
<text class="t-body-s" x="850" y="125">48px / 56px</text>
<text class="t-body-s" x="1000" y="125">700</text>
