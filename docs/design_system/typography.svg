<text class="t-body-s" x="1120" y="325">-0.01em</text>
<line x1="24" y1="355" x2="1288" y2="355" stroke="var(--border)" stroke-width="1"/>
<!-- H4 -->

<text class="t-code c-muted" x="24" y="390" font-size="13px">t-h4</text>
<text class="t-h4" x="300" y="400">Heading 4</text>
