<!-- ================= HIERARCHY EXAMPLE ================= --> <g id="hierarchy" transform="translate(64, 2000)"> <rect x="0" y="0" width="1312" height="200" rx="5" class="stroke-border"/>

<text class="t-overline c-muted" x="24" y="32">Hierarchy Example</text>
<g transform="translate(24, 60)"> <rect x="0" y="0" width="600" height="120" rx="5" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>

<text class="t-overline c-accent" x="24" y="28">Dashboard Widget</text>

<text class="t-h2" x="24" y="60">Revenue Overview</text>

<text class="t-body-m c-muted" x="24" y="88">Your monthly recurring revenue has increased by 15% compared to last month.</text>
<rect x="24" y="100" width="120" height="32" rx="5" class="bg-accent"/> <text class="t-button" x="84" y="120" text-anchor="middle" fill="#FFFFFF">View Report</text> </g> <g transform="translate(660, 60)"> <text class="t-overline c-muted" x="0" y="10">Composition Note</text> <text class="t-body-s" x="0" y="30">The combination of multiple typographic styles creates a clear visual hierarchy that guides the user's eye.</text> <text class="t-body-s" x="0" y="50">The overline establishes context, the heading commands attention, and the body text provides necessary details.</text> <text class="t-body-s" x="0" y="70">Buttons and interactive elements use distinct typography to signify their function.</text> </g> </g> <!-- ================= USAGE RULES ================= --> <g id="usage" transform="translate(64, 2240)"> <rect x="0" y="0" width="1312" height="160" rx="5" class="bg-surface"/>

<text class="t-overline c-muted" x="24" y="32">Usage Rules</text>
<!-- Do's --> <g transform="translate(24, 60)"> <text class="t-h4 c-accent" x="0" y="0">Nên</text> <text class="t-body-s" x="0" y="24">• Dùng tối đa 2-3 cấp chữ trong một khối nội dung.</text> <text class="t-body-s" x="0" y="48">• Dùng line-height 1.5 hoặc 1.6 cho các đoạn văn bản (Body).</text> <text class="t-body-s" x="0" y="72">• Sử dụng weight 600 cho heading để tách biệt với body.</text> <text class="t-body-s" x="0" y="96">• Giữ độ dài dòng (line length) trong khoảng 45-75 ký tự.</text> </g> <!-- Don'ts --> <g transform="translate(680, 60)"> <text class="t-h4 c-accent" x="0" y="0">Không nên</text> <text class="t-body-s" x="0" y="24">• Không viết hoa toàn bộ đoạn văn bản dài.</text> <text class="t-body-s" x="0" y="48">• Không dùng quá 3 weight chữ khác nhau trên cùng một màn hình.</text> <text class="t-body-s" x="0" y="72">• Không dùng letter-spacing âm cho các cỡ chữ nhỏ (dưới 18px).</text> <text class="t-body-s" x="0" y="96">• Không lạm dụng chữ in đậm để nhấn mạnh (hãy dùng màu sắc hoặc vị trí).</text> </g> </g></svg>