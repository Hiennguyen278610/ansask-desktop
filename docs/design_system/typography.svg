<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 2480" width="100%" height="100%" role="img"> <title>Typography Specimen - Quicksans</title> <desc>A comprehensive typography specimen for the Quicksans font, detailing scales, weights, character sets, and usage rules for the design system.</desc> <style> :root { --bg: #FFFFFF; --surface: #F8FAFC; --text: #0F172A; --text-muted: #475569; --border: #E2E8F0; --accent: #2563EB; --font-primary: 'quicksans', 'Quicksand', system-ui, -apple-system, sans-serif; --font-mono: 'Courier New', Courier, monospace; } text { font-family: var(--font-primary); text-rendering: optimizeLegibility; fill: var(--text); } .t-display { font-size: 48px; font-weight: 700; line-height: 56px; letter-spacing: -0.02em; } .t-h1 { font-size: 40px; font-weight: 700; line-height: 48px; letter-spacing: -0.02em; } .t-h2 { font-size: 32px; font-weight: 600; line-height: 40px; letter-spacing: -0.01em; } .t-h3 { font-size: 24px; font-weight: 600; line-height: 32px; letter-spacing: -0.01em; } .t-h4 { font-size: 20px; font-weight: 600; line-height: 28px; letter-spacing: 0; } .t-body-l { font-size: 18px; font-weight: 400; line-height: 28px; letter-spacing: 0; } .t-body-m { font-size: 16px; font-weight: 400; line-height: 24px; letter-spacing: 0; } .t-body-s { font-size: 14px; font-weight: 400; line-height: 20px; letter-spacing: 0; } .t-caption { font-size: 12px; font-weight: 400; line-height: 16px; letter-spacing: 0.04em; } .t-overline { font-size: 12px; font-weight: 600; line-height: 16px; letter-spacing: 0.08em; text-transform: uppercase; } .t-button { font-size: 16px; font-weight: 600; line-height: 24px; letter-spacing: 0.02em; } .t-code { font-family: var(--font-mono); font-size: 14px; font-weight: 400; line-height: 20px; letter-spacing: 0; } .c-muted { fill: var(--text-muted); } .c-accent { fill: var(--accent); } .bg-accent { fill: var(--accent); } .bg-surface { fill: var(--surface); } .stroke-border { stroke: var(--border); fill: none; stroke-width: 1; } .stroke-accent { stroke: var(--accent); fill: none; stroke-width: 1; } .w-300 { font-weight: 300; } .w-400 { font-weight: 400; } .w-500 { font-weight: 500; } .w-600 { font-weight: 600; } .w-700 { font-weight: 700; } </style> <!-- Background --> <rect width="1440" height="2480" fill="var(--bg)"/> <!-- ================= HEADER ================= --> <g id="header" transform="translate(64, 64)"> <text class="t-overline c-accent" y="20">Design System / Foundations</text> <text class="t-display" y="70">Typography</text> <g transform="translate(0, 110)"> <rect x="0" y="0" width="1312" height="120" rx="5" class="bg-surface"/>

<text class="t-overline c-muted" x="24" y="32">Font Family</text>
<text class="t-h3" x="24" y="60">Quicksans</text>
<text class="t-body-s c-muted" x="24" y="84">Geometric Sans-serif</text>

<text class="t-overline c-muted" x="280" y="32">Role</text>
<text class="t-body-m" x="280" y="60">SaaS Dashboard / Editorial</text>

<text class="t-overline c-muted" x="560" y="32">Weights Available</text>
<text class="t-body-m" x="560" y="60">300, 400, 500, 600, 700</text>

<text class="t-overline c-muted" x="880" y="32">Token Variable</text>
<text class="t-code c-accent" x="880" y="60">--font-primary</text>
<text class="t-code c-muted" x="880" y="84" font-size="12px">'quicksans', system-ui, sans-serif</text>
</g>
</g>
<!-- ================= HERO GLYPH ================= --> <g id="glyphs" transform="translate(64, 340)"> <rect x="0" y="0" width="1312" height="280" rx="5" class="stroke-border"/> <text class="t-caption c-muted" x="24" y="32">Hero Glyph</text>

<text x="656" y="190" text-anchor="middle" font-size="160px" font-weight="700" letter-spacing="-0.04em">Aa</text>

<text x="24" y="244" class="t-body-s c-muted">Quicksans Bold (700)</text>
<text x="1288" y="244" text-anchor="end" class="t-body-s c-muted">A-Z, a-z, 0-9</text>
</g>
