<!-- Vietnamese Support -->

<text class="t-overline c-accent" x="680" y="70" font-size="10px">Vietnamese Diacritics</text>
<text class="t-body-m w-500" x="680" y="90" fill="var(--text-muted)">ÀÁẢÃẠ ĂẰẮẲẴẶ ÂẦẤẨẪẬ ĐÈÉẺẼẸ</text>
<text class="t-body-m w-500" x="680" y="110" fill="var(--text-muted)">ÊỀẾỂỄỆ ÌÍỈĨỊ ÒÓỎÕỌ ÔỒỐỔỖỘ</text>
<text class="t-body-m w-500" x="680" y="130" fill="var(--text-muted)">ƠỜỚỞỠỢ ÙÚỦŨỤ ƯỪỨỬỮỰ ỲÝỶỸỴ</text>
<!-- Pangram -->

<text class="t-overline c-muted" x="680" y="190" font-size="10px">Pangram</text>
<text class="t-body-m w-500" x="680" y="210">Tôi muốn ăn kem. Lập trình viên thích uống cà phê.</text>
<text class="t-body-m w-500 c-muted" x="680" y="234">Trăm năm trong cõi người ta, chữ tài chữ mệnh khéo là ghét nhau.</text>
</g>
