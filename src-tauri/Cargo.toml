[package]
name = "ansask-desktop"
version = "0.1.0"
description = "ansask-desktop — desktop luyện thi trắc nghiệm offline-first"
authors = ["you"]
edition = "2021"

[lib]
name = "ansask_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Sprint 00 — SQLite + persistence (structure-be §2.1/§9.2)
rusqlite = { version = "0.32", features = ["bundled"] }
rusqlite_migration = "1"
r2d2 = "0.8"
r2d2_sqlite = "0.25"

# Sprint 00 — misc
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
rand = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
